<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" role="img" aria-label="短剧创作示意：大纲、分集、角色场景统一管理">
  <defs>
    <clipPath id="dw"><rect x="0" y="0" width="800" height="480" rx="16"/></clipPath>
    <linearGradient id="dMain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#dw)">
    <rect width="800" height="480" fill="#ffffff"/>
    <rect width="800" height="38" fill="#f8fafc"/>
    <line x1="0" y1="38" x2="800" y2="38" stroke="#e8edf4"/>
    <circle cx="24" cy="19" r="5" fill="#e2e8f0"/>
    <circle cx="44" cy="19" r="5" fill="#e2e8f0"/>
    <circle cx="64" cy="19" r="5" fill="#e2e8f0"/>

    <!-- 左：大纲树 -->
    <rect x="0" y="38" width="248" height="442" fill="#f8fafc"/>
    <line x1="248" y1="38" x2="248" y2="480" stroke="#e8edf4"/>
    <text x="24" y="72" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#0f172a">大纲</text>
    <g font-family="Segoe UI, PingFang SC, sans-serif" font-size="12.5">
      <rect x="16" y="88" width="216" height="30" rx="8" fill="#eef2fe"/>
      <text x="34" y="108" fill="#1a3fae" font-weight="600">第一幕 · 相遇</text>
      <rect x="16" y="124" width="216" height="30" rx="8"/>
      <text x="34" y="144" fill="#475569">第二幕 · 转折</text>
      <rect x="16" y="160" width="216" height="30" rx="8"/>
      <text x="34" y="180" fill="#475569">第三幕 · 收束</text>
    </g>

    <text x="24" y="224" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#0f172a">角色</text>
    <circle cx="38" cy="250" r="14" fill="url(#dMain)"/>
    <text x="60" y="255" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12" fill="#334155">阿黎 · 女主</text>
    <circle cx="38" cy="286" r="14" fill="#a855f7"/>
    <text x="60" y="291" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12" fill="#334155">老板娘 · 配角</text>
    <circle cx="38" cy="322" r="14" fill="#10b981"/>
    <text x="60" y="327" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12" fill="#334155">路人 · 群演</text>

    <text x="24" y="368" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#0f172a">场景</text>
    <rect x="16" y="382" width="216" height="34" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="24" y="390" width="40" height="18" rx="5" fill="#cbd5e1"/>
    <text x="74" y="404" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12" fill="#475569">街角饮品店</text>
    <rect x="16" y="422" width="216" height="34" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="24" y="430" width="40" height="18" rx="5" fill="#cbd5e1"/>
    <text x="74" y="444" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12" fill="#475569">傍晚的天台</text>

    <!-- 右：分集卡片 -->
    <text x="280" y="72" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#0f172a">第一幕 · 相遇</text>
    <rect x="660" y="54" width="116" height="30" rx="15" fill="#0f172a"/>
    <text x="718" y="73" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">生成本集画面</text>

    <rect x="280" y="96" width="496" height="118" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="296" y="112" width="96" height="72" rx="8" fill="#dbeafe"/>
    <path d="M308 176l20-24 16 17 11-11 18 18z" fill="#93b4fb"/>
    <circle cx="366" cy="128" r="6" fill="#ffffff"/>
    <text x="408" y="132" font-family="Segoe UI, PingFang SC, sans-serif" font-size="14" font-weight="600" fill="#0f172a">第 1 集 · 推门而入</text>
    <rect x="408" y="144" width="336" height="7" rx="3.5" fill="#cbd5e1"/>
    <rect x="408" y="161" width="300" height="7" rx="3.5" fill="#cbd5e1"/>
    <rect x="408" y="178" width="242" height="7" rx="3.5" fill="#cbd5e1"/>
    <rect x="408" y="196" width="72" height="18" rx="9" fill="#eef2fe"/>
    <text x="444" y="209" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#1a3fae" text-anchor="middle">已出图</text>
    <rect x="488" y="196" width="72" height="18" rx="9" fill="#eef2fe"/>
    <text x="524" y="209" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#1a3fae" text-anchor="middle">已出视频</text>

    <rect x="280" y="230" width="496" height="118" rx="14" fill="#ffffff" stroke="#93b4fb" stroke-width="1.5"/>
    <rect x="296" y="246" width="96" height="72" rx="8" fill="#eef2fe" stroke="#93b4fb" stroke-dasharray="5 4"/>
    <circle cx="344" cy="282" r="16" fill="#93b4fb" opacity="0.35"/>
    <path d="M339 275l12 7-12 7z" fill="#1a3fae"/>
    <text x="408" y="266" font-family="Segoe UI, PingFang SC, sans-serif" font-size="14" font-weight="600" fill="#0f172a">第 2 集 · 第一次搭话</text>
    <rect x="408" y="278" width="336" height="7" rx="3.5" fill="#cbd5e1"/>
    <rect x="408" y="295" width="288" height="7" rx="3.5" fill="#cbd5e1"/>
    <rect x="408" y="312" width="316" height="7" rx="3.5" fill="#cbd5e1"/>
    <rect x="408" y="330" width="72" height="18" rx="9" fill="#eef2fe"/>
    <text x="444" y="343" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#1a3fae" text-anchor="middle">草稿</text>

    <rect x="280" y="364" width="496" height="94" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="296" y="378" width="72" height="66" rx="8" fill="#e2e8f0"/>
    <rect x="386" y="382" width="200" height="10" rx="5" fill="#cbd5e1"/>
    <rect x="386" y="404" width="280" height="7" rx="3.5" fill="#e2e8f0"/>
    <rect x="386" y="421" width="240" height="7" rx="3.5" fill="#e2e8f0"/>
    <text x="386" y="440" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#94a3b8">还没生成，点右侧按钮开始</text>
  </g>
  <rect x="0.5" y="0.5" width="799" height="479" rx="16" fill="none" stroke="#e2e8f0"/>
</svg>
