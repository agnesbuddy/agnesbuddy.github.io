<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" role="img" aria-label="AgnesBuddy 主界面示意：左侧模块导航，右侧 AI 对话区">
  <defs>
    <clipPath id="win"><rect x="0" y="0" width="800" height="480" rx="16"/></clipPath>
    <linearGradient id="brandG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#win)">
    <!-- 窗口底 -->
    <rect width="800" height="480" fill="#ffffff"/>
    <!-- 顶栏 -->
    <rect width="800" height="38" fill="#f8fafc"/>
    <line x1="0" y1="38" x2="800" y2="38" stroke="#e8edf4" stroke-width="1"/>
    <circle cx="24" cy="19" r="5" fill="#e2e8f0"/>
    <circle cx="44" cy="19" r="5" fill="#e2e8f0"/>
    <circle cx="64" cy="19" r="5" fill="#e2e8f0"/>

    <!-- 左侧栏 -->
    <rect x="0" y="38" width="196" height="442" fill="#dfe5fb"/>
    <line x1="196" y1="38" x2="196" y2="480" stroke="#c7d2fe" stroke-width="1"/>
    <!-- 品牌行 -->
    <rect x="18" y="55" width="26" height="26" rx="7" fill="url(#brandG)"/>
    <text x="31" y="72" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">AG</text>
    <text x="53" y="73" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">AgnesBuddy</text>
    <!-- 菜单项 -->
    <g font-family="Segoe UI, PingFang SC, sans-serif" font-size="12.5" fill="#334155">
      <rect x="14" y="102" width="168" height="30" rx="8" fill="#c7d2fe"/>
      <rect x="26" y="112" width="13" height="13" rx="3" fill="#1d4ed8"/>
      <text x="48" y="122" fill="#1a3fae" font-weight="600">新对话</text>

      <rect x="26" y="148" width="13" height="13" rx="3" fill="#64748b"/>
      <text x="48" y="158">资产库</text>
      <rect x="26" y="180" width="13" height="13" rx="3" fill="#64748b"/>
      <text x="48" y="190">短剧</text>
      <rect x="26" y="212" width="13" height="13" rx="3" fill="#64748b"/>
      <text x="48" y="222">无限画布</text>
      <rect x="26" y="244" width="13" height="13" rx="3" fill="#64748b"/>
      <text x="48" y="254">流水线</text>
    </g>
    <!-- 任务分组 -->
    <line x1="14" y1="278" x2="182" y2="278" stroke="#c7d2fe" stroke-width="1"/>
    <text x="18" y="300" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11.5" fill="#64748b" font-weight="600">任务</text>
    <rect x="14" y="310" width="168" height="26" rx="7" fill="#eef2fe"/>
    <text x="26" y="327" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12" fill="#334155">夏日饮品分镜</text>
    <rect x="14" y="342" width="168" height="26" rx="7"/>
    <text x="26" y="359" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12" fill="#475569">开场旁白润色</text>
    <!-- 底部用户行 -->
    <rect x="14" y="438" width="168" height="30" rx="8" fill="#eef2fe"/>
    <circle cx="32" cy="453" r="8" fill="#93b4fb"/>
    <rect x="46" y="449" width="60" height="7" rx="3.5" fill="#94a3b8"/>

    <!-- 主区 -->
    <rect x="196" y="38" width="604" height="442" fill="#ffffff"/>
    <text x="228" y="74" font-family="Segoe UI, PingFang SC, sans-serif" font-size="15" font-weight="700" fill="#0f172a">夏日饮品分镜</text>

    <!-- 用户气泡 -->
    <rect x="510" y="98" width="252" height="52" rx="12" fill="url(#brandG)"/>
    <text x="526" y="120" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12" fill="#ffffff">帮我写一条 15 秒的开场</text>
    <text x="526" y="138" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12" fill="#dbeafe">文案，要有清凉感</text>

    <!-- 助手气泡 -->
    <rect x="228" y="166" width="330" height="112" rx="12" fill="#f1f5f9"/>
    <rect x="244" y="182" width="290" height="7" rx="3.5" fill="#cbd5e1"/>
    <rect x="244" y="199" width="266" height="7" rx="3.5" fill="#cbd5e1"/>
    <rect x="244" y="216" width="242" height="7" rx="3.5" fill="#cbd5e1"/>
    <rect x="244" y="233" width="198" height="7" rx="3.5" fill="#cbd5e1"/>
    <rect x="244" y="250" width="150" height="7" rx="3.5" fill="#cbd5e1"/>

    <!-- 生成的图片卡片 -->
    <rect x="228" y="294" width="120" height="76" rx="10" fill="#e2e8f0"/>
    <path d="M240 358l26-30 20 22 14-14 22 22z" fill="#94a3b8"/>
    <circle cx="316" cy="318" r="7" fill="#cbd5e1"/>
    <rect x="360" y="294" width="120" height="76" rx="10" fill="#e2e8f0"/>
    <path d="M372 358l26-30 20 22 14-14 22 22z" fill="#94a3b8"/>
    <circle cx="448" cy="318" r="7" fill="#cbd5e1"/>
    <rect x="492" y="294" width="120" height="76" rx="10" fill="#eef2fe"/>
    <circle cx="552" cy="332" r="18" fill="#93b4fb"/>
    <path d="M547 325l14 7-14 7z" fill="#ffffff"/>

    <!-- 输入栏 -->
    <rect x="228" y="398" width="384" height="42" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="246" y="424" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12.5" fill="#94a3b8">接着写下一句…</text>
    <rect x="624" y="398" width="48" height="42" rx="12" fill="url(#brandG)"/>
    <path d="M640 412l22 8-22 8z" fill="#ffffff"/>
  </g>
  <rect x="0.5" y="0.5" width="799" height="479" rx="16" fill="none" stroke="#e2e8f0"/>
</svg>
